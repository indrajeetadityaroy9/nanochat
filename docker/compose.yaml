# nanochat pretraining on node-local data. One rank per visible GPU on the node (torchrun --nproc-per-node=gpu),
# or set NPROC_PER_NODE.
#
#   docker compose -f docker/compose.yaml run --rm prepare     # tokenizer, raw corpus -> Megatron .bin/.idx shards
#   docker compose -f docker/compose.yaml run --rm train       # train on the compiled shards
#
# Set DATA_HOST to node-local NVMe: it holds the raw corpora and compiled shards.
# Multi-node: every node reads the tokenizer and compiled shards locally, so give each node the same RUNS_HOST and
# DATA_HOST contents (a shared filesystem, or a copy made after `prepare`), then run `train` on every node with
# TRAIN_ARGS unchanged and torchrun rendezvous flags in TORCHRUN_ARGS (e.g. "--nnodes=4 --node-rank=0 --rdzv-endpoint=host:29500").
name: nanochat

x-env: &env
  NANOCHAT_BASE_DIR: /runs
  HF_HOME: /runs/data/huggingface
  HF_TOKEN: ${HF_TOKEN:-}
  WANDB_API_KEY: ${WANDB_API_KEY:-}
  DATASET: ${DATASET:-climbmix}
  NUM_FILES: ${NUM_FILES:-170}
  SEQ_LEN: ${SEQ_LEN:-2048}
  NPROC_PER_NODE: ${NPROC_PER_NODE:-gpu}
  TORCHRUN_ARGS: ${TORCHRUN_ARGS:---standalone}
  TRAIN_ARGS: ${TRAIN_ARGS:---depth=24 --target-param-data-ratio=8 --device-batch-size=16 --fp8}

x-volumes: &volumes
  - ${RUNS_HOST:-./runs}:/runs
  - ${DATA_HOST:-./data}:/runs/data

x-nanochat: &nanochat
  image: ${NANOCHAT_IMAGE:-nanochat:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment: *env
  volumes: *volumes
  ipc: host # DataLoader workers hand batches over through shared memory; NCCL needs it too
  ulimits:
    memlock: -1
    stack: 67108864

services:
  prepare:
    <<: *nanochat
    command: >-
      bash -c 'python -m nanochat.tokenizer --dataset="$$DATASET" &&
      python -m nanochat.data.compile --dataset="$$DATASET" --seq-len="$$SEQ_LEN" --max-files="$$NUM_FILES"'

  train:
    <<: *nanochat
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >-
      bash -c 'torchrun $$TORCHRUN_ARGS --nproc-per-node="$$NPROC_PER_NODE" -m scripts.base_train --
      --dataset="$$DATASET" --max-seq-len="$$SEQ_LEN" $$TRAIN_ARGS'
