# @package _global_
# Output-logit soft-capping: cap 15 against none; d16 at 20 tokens per parameter on the sa-bpe arm's data, seeds 0-3,
# at the base model's lr multiplier (ablations.peak_lr.analysis "base_multiplier", as pretrain.yaml resolves it).
# Analysis: ablations.logit_softcap.analysis.
num_hidden_layers: 16
tokens_per_param: 20.0
tokenizer: sa-bpe
learning_rate_scale: ${lr_multiplier:}

hydra:
  sweeper:
    params:
      final_logit_softcapping: null,15.0
      seed: range(4)
  callbacks:
    records:
      _target_: ablations.records.Records
      analysis: ablations.logit_softcap.analysis
