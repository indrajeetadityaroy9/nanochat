# @package _global_
# Output-logit soft-capping: cap 15 against none; d16 at 20 tokens per parameter on the sa-bpe arm's data, seeds 0-3,
# at a fixed lr multiplier (ablations.peak_lr.analysis "base_multiplier"; fixed because ${lr_multiplier:} needs the
# corpus tokenizer, which exists only after tokenizer_split_merge's adopt). Analysis: ablations.recipe.logit_softcap.
depth: 16
ratio: 20.0
tokenizer: sa-bpe
lr_scale: 2.7972

hydra:
  sweeper:
    params:
      softcap: null,15.0
      seed: range(4)
  callbacks:
    records:
      _target_: ablations.records.Records
      analysis: ablations.recipe.logit_softcap
