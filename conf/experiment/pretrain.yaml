# @package _global_
# Pre-training of the base model: the run app's defaults (run.py RunConfig, conf/run.yaml), plus a checkpoint at each
# tenth of the run and at the repository stage's start, each evaluated with every benchmark. No analysis.
num_checkpoints: 10
generate: benchmarks

hydra:
  callbacks:
    records:
      _target_: ablations.records.Records
      analysis: null
