# @package _global_
# AdamW group lr: the AdamW groups' lr x 1/4 and x 4 against x 1 at their decay timescale, Muon's untouched; d16 on
# the sa-bpe arm's data at its max_ratio, seeds 0 and 1; the x 1 runs are tokenizer_split_merge's sa-bpe runs (the
# same run keys). Analysis: ablations.recipe.adamw_group_lr.
depth: 16
ratio: null
tokenizer: sa-bpe

hydra:
  sweeper:
    params:
      adamw_lr_scale: 0.25,1.0,4.0
      seed: range(2)
  callbacks:
    records:
      _target_: ablations.records.Records
      analysis: ablations.recipe.adamw_group_lr
