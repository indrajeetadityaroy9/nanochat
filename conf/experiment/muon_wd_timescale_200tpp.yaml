# @package _global_
# Muon weight-decay EMA timescale at 200 tokens per parameter: x 1/2 and x 2 against the tau law (x 1); d8 on the
# corpus tokenizer's data, seeds 0 and 1. Runs after muon_wd_timescale_20tpp, whose result its analysis reads.
# Analysis: ablations.muon_wd_timescale.law.
num_hidden_layers: 8
tokens_per_param: 200.0
tokenizer: corpus

hydra:
  sweeper:
    params:
      muon_tau_scale: 0.5,1.0,2.0
      seed: range(2)
  callbacks:
    records:
      _target_: ablations.records.Records
      analysis: ablations.muon_wd_timescale.law
