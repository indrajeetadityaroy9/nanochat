# @package _global_
# D5, the output-logit softcap (ablations/recipe.py softcap; ACTIONS.md §8): cap 15 against none, d16 at 20 tokens per
# parameter on the sa-bpe arm's data, 4 paired seeds, at the base model's lr multiplier: ablations/lr.py analysis
# "base_multiplier" under DeepSeek LLM Eq. 2's M (ACTIONS.md §8 D1), fixed here because its resolver
# (${lr_multiplier:}) needs the corpus tokenizer, which exists only after the tokenizer ablation's adopt.
depth: 16
ratio: 20.0
tokenizer: sa-bpe
lr_scale: 2.7972

hydra:
  sweeper:
    params:
      softcap: null,15.0
      seed: range(4)
  callbacks:
    records:
      _target_: ablations.records.Records
      analysis: ablations.recipe.softcap
