# @package _global_
# Pre-tokenizer split pattern x BPE merge score (ablations/tokenizer.py): arms sa-bpe (baseline), sa-bpe-fused, hybrid,
# bpe, each at d16 (tokenizer.NUM_HIDDEN_LAYERS) at its max_tokens_per_param (tokens_per_param null: equal bytes),
# seeds 0 and 1.
# Analysis: ablations.tokenizer.decide.
num_hidden_layers: 16
tokens_per_param: null

hydra:
  sweeper:
    params:
      tokenizer: sa-bpe,sa-bpe-fused,hybrid,bpe
      seed: range(2)
  callbacks:
    records:
      _target_: ablations.records.Records
      analysis: ablations.tokenizer.decide
