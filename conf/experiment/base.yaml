# @package _global_
# Pre-training of the base model end to end: d24 at the most tokens per scaling parameter its data holds without
# rereading a document (ratio null: train/stages.py max_ratio), seed 0, the peak lr ablations/lr.py's multiplier times
# the law's (DeepSeek LLM, arXiv 2401.02954 §3.1; lr.py analysis "base_multiplier": d24 at 5's optimum, the d8 ratio
# over 5 -> 200 tokens per parameter, the square-root batch rule, arXiv 2205.10287), both stages, a checkpoint at each
# tenth of the run (the capability curve over training; the tenth tenth is the final model) and at the repository
# stage's start (the model before it), each evaluated with every benchmark.
depth: 24
ratio: null
seed: 0
lr_scale: ${lr_multiplier:}
checkpoints: 10
generate: benchmarks

hydra:
  callbacks:
    records:
      _target_: ablations.records.Records
      analysis: null
