# Run app root config (run.py): RunConfig's defaults, then conf/experiment/<name>.yaml, then command-line overrides
defaults:
  - run_schema
  - _self_
  - experiment: null
  # Hydra's job log would be RUNS/<run_name>/run.log, the phases' log
  - override hydra/job_logging: none

# the law's peak lr times the base multiplier (run.py lr_multiplier); resolved, so run names carry it
learning_rate_scale: ${lr_multiplier:}

hydra:
  # every invocation a sweep, one job without sweep parameters
  mode: MULTIRUN
  sweep:
    dir: ${runs:}
    subdir: ${run_name:}
