# The run app's root config (run.py): the base model's recipe, RunConfig's defaults, then an experiment's
# fields and sweep (conf/experiment/<name>.yaml, selected by experiment=<name>) and the command line's overrides.
defaults:
  - run_schema
  - _self_
  - experiment: null
  # Hydra's default job logging writes ${hydra.job.name}.log, RUNS/<run_name>/run.log, the phases' log (run.py)
  - override hydra/job_logging: none

hydra:
  # every invocation a sweep: one job without sweep parameters
  mode: MULTIRUN
  sweep:
    dir: ${runs:}
    subdir: ${run_name:}
  sweeper:
    # one job per batch: the first failed job stops the sweep
    max_batch_size: 1
