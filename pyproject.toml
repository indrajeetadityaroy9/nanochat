[project]
name = "nanochat"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "basedpyright==1.40.2",
    "duckdb==2.0.0",
    "evalplus",
    "fire==0.7.1",
    "fissix==24.4.24",
    "flash-attn-4==4.0.0b36",
    "huggingface-hub==2.3.0",
    "hydra-core==1.3.8",
    "lark[interegular]==1.3.1",
    "nvidia-cutlass-dsl[cu13]==4.8.1",
    "obstore==0.12.0",
    "omegaconf==2.3.1",
    "psutil==7.2.2",
    "pyarrow==26.0.0",
    "quack-kernels==0.6.5",
    "statsmodels==0.15.0",
    "tiktoken==0.14.0",
    # with fire: the requirements of the human-eval-infilling and MultiPL-E checkouts (docker/Dockerfile)
    "tqdm==4.70.1",
]

[tool.uv]
# the NGC platform stack, and evalplus's model-provider clients (its unused code generation)
exclude-dependencies = [
    "torch", "triton", "numpy", "nvidia-ml-py",
    "openai", "anthropic", "google-generativeai", "boto3", "ollama", "transformers",
]

[tool.uv.sources]
evalplus = { git = "https://github.com/evalplus/evalplus", rev = "26d6d00bb1fd0fa37f39c99d5290da67891d1c5e" }
