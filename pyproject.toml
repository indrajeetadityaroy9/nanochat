[project]
name = "nanochat"
version = "0.1.0"
description = "nanochat fork: pretraining a Python and C++ code-generation base model on one NVIDIA H100"
readme = "README.md"
# the Python of NVIDIA's NGC PyTorch images (26.09: 3.12), the environment nanochat runs in
requires-python = ">=3.12"
# PyTorch and what it needs (Triton, the CUDA libraries, numpy) come from the NGC PyTorch image as NVIDIA built them:
# docker/Dockerfile prunes torch and numpy from the lock. Every other package is at its latest release in uv.lock
# (uv lock --upgrade), FlashAttention-4 and QuACK at the latest commit of their repositories.
dependencies = [
    "duckdb",
    # FlashAttention-4 (CuTe DSL), from github.com/Dao-AILab/flash-attention (tool.uv.sources). It brings cuda-bindings,
    # TVM FFI and QuACK; not its cu13 extra, whose PyTorch index conflicts with QuACK's while torch comes from the image.
    "flash-attn-4",
    # EvalPlus's official evaluation of HumanEval+ / MBPP+ (nanochat/eval/code_eval.py runs its entry point), pinned
    # (tool.uv.sources); docker/Dockerfile prunes its model-provider clients (openai, anthropic, google-generativeai,
    # boto3, ollama, transformers), which only its code generation imports
    "evalplus",
    "huggingface-hub",
    # CuTe DSL with its CUDA 13 libraries, matching the image's CUDA 13
    "nvidia-cutlass-dsl[cu13]",
    "numpy",
    "obstore",
    # the studies' and the report's tables: tidy results as DataFrames, CSV, Parquet and Markdown (experiments/studies.py,
    # scripts/report.py)
    "pandas",
    # 25.0.1: ParquetFile pre-buffers (coalesces) reads by default; 25.0.0 returns wrong doubles on Arm CPUs with SVE
    "pyarrow>=25.0.1",
    # the ablation studies' designs: fractional factorials and their alias structure (experiments/studies.py)
    "pydoe",
    # QuACK's CuTe DSL kernels, from github.com/Dao-AILab/quack (tool.uv.sources)
    "quack-kernels",
    # the LSH band count's integrals (nanochat/data/dedup.py rows)
    "scipy",
    # the studies' estimates: factorial effects by OLS, ANOVA, WLS fits with their prediction intervals
    # (experiments/studies.py)
    "statsmodels",
    # pandas' DataFrame.to_markdown
    "tabulate",
    # OpenAI's encoder of the trained vocabulary (nanochat/data/tokenizer.py); the SA-BPE trainer is the crate nanochat/data/bpe
    "tiktoken",
    "torch",
]

[dependency-groups]
# what building FlashAttention-4 from source needs beyond the image's setuptools (its build-system requirement):
# docker/Dockerfile builds the git sources without build isolation, against the image's packages
build = [
    "setuptools-scm>=8",
]

[tool.uv]
# NVIDIA GPU hosts only
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
flash-attn-4 = { git = "https://github.com/Dao-AILab/flash-attention", subdirectory = "flash_attn/cute" }
quack-kernels = { git = "https://github.com/Dao-AILab/quack" }
evalplus = { git = "https://github.com/evalplus/evalplus", rev = "26d6d00bb1fd0fa37f39c99d5290da67891d1c5e" }
