[project]
name = "nanochat"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "basedpyright==1.40.2",
    "duckdb==1.5.6",
    "evalplus",
    "fissix==24.4.24",
    # openai/human-eval-infilling's requirements.txt (its checkout is on sys.path, docker/Dockerfile; numpy: the image)
    "fire==0.7.1",
    "flash-attn-4==4.0.0b35",
    "huggingface-hub==2.2.0",
    "hydra-core==1.3.7",
    # Lark(strict=True) checks terminal collisions with interegular
    "lark[interegular]==1.3.1",
    # CuTe DSL of quack-kernels and flash-attn-4, CUDA 13 (the NGC image's)
    "nvidia-cutlass-dsl[cu13]==4.8.1",
    # NVML (train/diagnostics.py)
    "nvidia-ml-py==13.610.43",
    "obstore==0.12.0",
    "omegaconf==2.3.1",
    "psutil==7.2.2",
    "pyarrow==26.0.0",
    "quack-kernels==0.6.5",
    "regex==2026.9.29",
    "safetensors==0.8.0",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "tiktoken==0.14.0",
    "tokenizers==0.23.3",
    "tqdm==4.70.1",
    "transformers==5.20.2",
]

[tool.uv]
# torch and numpy from the NGC image; evalplus's model-provider clients serve only its unused code generation
exclude-dependencies = ["torch", "numpy", "openai", "anthropic", "google-generativeai", "boto3", "ollama"]

[tool.uv.sources]
evalplus = { git = "https://github.com/evalplus/evalplus", rev = "26d6d00bb1fd0fa37f39c99d5290da67891d1c5e" }
