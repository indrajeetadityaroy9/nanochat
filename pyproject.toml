[project]
name = "nanochat"
version = "0.1.0"
description = "the minimal full-stack ChatGPT clone"
readme = "README.md"
# the Python of NVIDIA's NGC PyTorch images (26.08: 3.12), the environment nanochat runs in
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "filelock>=3.19.0",
    # FlashAttention-4 (CuTe DSL) for Hopper and Blackwell; cu13 matches PyTorch's CUDA 13 builds
    "flash-attn-4[cu13]==4.0.0b32",
    # HTTP range reads of Hub files at their resolved storage URLs (nanochat/data/pretrain/sources.py)
    "fsspec[http]>=2026.9.0",
    "huggingface-hub>=0.34.0",
    "jinja2>=3.1.0",
    # DeMix's mixture predictor (scripts/demix.py)
    "lightgbm>=4.6",
    "numpy>=1.26.0",
    "obstore>=0.11.1",
    # 25.0.1: ParquetFile pre-buffers (coalesces) reads by default; 25.0.0 returns wrong doubles on Arm CPUs with SVE
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.2",
    "rustbpe>=0.1.0",
    "tiktoken>=0.14.0",
    # PyPI's Linux wheels are the CUDA 13 build
    "torch>=2.14.0",
    "wandb>=0.21.3",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.1",
]

[tool.uv]
default-groups = []
# NVIDIA GPU hosts only: x86_64 (Hopper, Blackwell) and aarch64 (Grace Hopper, Grace Blackwell, DGX Spark)
environments = ["sys_platform == 'linux'"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
