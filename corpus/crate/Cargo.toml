[package]
name = "nanochat_crate"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
# typed views of the memory-mapped tokenized tokens and document offsets, and of the packed rows returned
bytemuck = "1.25.2"
# the regex engine of OpenAI's tiktoken (0.14: fancy-regex 0.19), so training splits text as encoding does
fancy-regex = "0.19.2"
# the trainer's set of sources holding a pair (its R): a bitset over the sources
fixedbitset = "0.5.7"
# the process's stack limit (getrlimit), the stack of rayon's workers (lib.rs)
libc = "0.2.190"
# the tokenized tokens and offsets (pack), read in place
memmap2 = "0.9.11"
# lexical cleaning of the paths a C++ #include names (repository samples)
path-clean = "1.0.1"
# the dependency graph of a repository's files: strongly connected components in topological order, weak components
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
# the draws of fill-in-the-middle (uniform and size-weighted choices from a per-piece ChaCha8 stream)
rand = { version = "0.10.3", default-features = false, features = ["alloc"] }
rand_chacha = "0.10.0"
rayon = "1.12.0"
# FxHash maps and sets
rustc-hash = "2.1.3"
# OpenAI tiktoken's encoder (its core, fancy-regex 0.19 as tiktoken's), for the sections of fill-in-the-middle examples
tiktoken-rs = "0.12.1"
# the grammars of the repository source files: imports (repository samples), statement cuts and AST-FIM (pack;
# arXiv 2506.00204)
tree-sitter = "0.27.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-python = "0.25.0"

# Whole-crate optimization, measured against cargo's release defaults on real data: pack of six shards 36.4 s against
# 42.9 s, train of 8,000 merges on 252,906 documents 20.6 s against 22.1 s, outputs identical
[profile.release]
codegen-units = 1
lto = true
